  <main class="container py-7">
    <h1>Read Mode</h1>
    <p class="fs-lg fw-light">Paste a Hebrew or Aramaic text, then tap any word to see its dictionary entry.</p>

    <form id="read-form" class="mb-7">
      <label for="read-input" class="form-label">Paste your text</label>
      <textarea class="form-control targum-headword fs-lg" id="read-input" rows="6" lang="he" dir="rtl" placeholder="הדבק כאן טקסט בעברית או בארמית…"></textarea>
      <div class="d-flex flex-wrap gap-3 mt-5">
        <button class="btn-solid theme-primary" type="submit">Show text</button>
        <button class="btn-outline theme-secondary" type="button" id="read-clear">Clear</button>
      </div>
    </form>

    <section id="read-output" aria-label="Your text" hidden>
      <h2 class="h4">Your text</h2>
      <p class="fg-secondary small">Tap a word to look it up.</p>
      <div id="read-text" class="targum-headword fs-lg lh-lg border rounded p-5 mb-7" lang="he" dir="rtl"></div>
      <div id="entry-panel" aria-live="polite"></div>
    </section>
  </main>
  <div id="footer-root"></div>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
