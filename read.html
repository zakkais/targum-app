</head>
<body>

    <noscript>

  </div>
  <main class="container py-4">
    <h1>Read Mode</h1>
    <p class="lead">Paste a Hebrew or Aramaic text, then tap any word to see its dictionary entry.</p>

    <form id="read-form" class="mb-4">
      <label for="read-input" class="form-label">Paste your text</label>
      <textarea class="form-control targum-headword fs-5" id="read-input" rows="6" lang="he" dir="rtl" placeholder="הדבק כאן טקסט בעברית או בארמית…"></textarea>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-primary" type="submit">Show text</button>
        <button class="btn btn-outline-secondary" type="button" id="read-clear">Clear</button>
      </div>
    </form>

    <section id="read-output" aria-label="Your text" hidden>
      <h2 class="h4">Your text</h2>
      <p class="text-body-secondary small">Tap a word to look it up.</p>
      <div id="read-text" class="targum-headword fs-5 lh-lg border rounded p-3 mb-4" lang="he" dir="rtl"></div>
      <div id="entry-panel" aria-live="polite"></div>
    </section>
  </main>
  <div id="footer-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
