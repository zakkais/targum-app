</head>

  <main class="container py-7">
    <h1>Dictionary</h1>
    <p class="fs-lg fw-light">Look up words in Modern Hebrew, Lashon HaKodesh, Aramaic, Yiddish, and English.</p>

    <form id="search-form" role="search" class="mb-5">
      <label for="dict-search" class="form-label">Search the dictionary</label>
      <div class="input-group">
        <input type="search" class="form-control form-control-lg" id="dict-search" placeholder="Search Hebrew, Aramaic, Yiddish, or English…" aria-label="Search the dictionary" autocomplete="off">
        <button class="btn-solid theme-primary btn-lg" type="submit">Search</button>
      </div>
    </form>

    <div class="mb-5">
      <div class="nav nav-pills flex-wrap gap-1" id="lang-filter" role="group" aria-label="Language filter">
        <button type="button" class="nav-link active" data-lang="all" aria-pressed="true">All</button>
        <button type="button" class="nav-link" data-lang="modern" aria-pressed="false">Modern Hebrew</button>
        <button type="button" class="nav-link" data-lang="ancient" aria-pressed="false">Lashon HaKodesh</button>
        <button type="button" class="nav-link" data-lang="aramaic" aria-pressed="false">Aramaic</button>
        <button type="button" class="nav-link" data-lang="yiddish" aria-pressed="false">Yiddish</button>
        <button type="button" class="nav-link" data-lang="english" aria-pressed="false">English gloss search</button>
      </div>
    </div>

    <div class="form-field mb-5" id="translit-wrap" hidden>
      <div class="switch theme-primary">
        <input type="checkbox" role="switch" switch id="translit-toggle" checked>
      </div>
      <label for="translit-toggle">Show Yiddish transliteration</label>
    </div>

    <div id="results" aria-live="polite"></div>

    <h2 class="h4 mt-12">Browse alphabetically</h2>
    <div class="d-flex flex-wrap gap-1 mb-3" id="aleph-beis" dir="rtl" role="group" aria-label="Aleph-Beis index"></div>
    <button type="button" class="btn-outline theme-primary mb-5" id="browse-all-btn" aria-pressed="false">Browse all entries</button>
    <p class="fg-secondary">Choose a letter to list entries starting with it, or browse all entries in alphabetical order.</p>
  </main>
  <div id="footer-root"></div>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      'use strict';

      var PAGE_SIZE = 200;
      var searchInput = document.getElementById('dict-search');
      var searchForm = document.getElementById('search-form');
      var filterEl = document.getElementById('lang-filter');
      var resultsEl = document.getElementById('results');
      var translitWrap = document.getElementById('translit-wrap');
      var translitToggle = document.getElementById('translit-toggle');
      var lettersEl = document.getElementById('aleph-beis');
      var browseAllBtn = document.getElementById('browse-all-btn');

      var currentLang = 'all';
      var currentResults = [];
      var shownCount = 0;
      var currentLetter = null;
      var searchTimer = null;
      var searchSeq = 0;
      // Browse-all (scroll) mode: entries load in chunks as the
      // user scrolls, instead of all at once.
      var browseAll = false;
      var browseObserver = null;
      var browseLastLetter = '';
      var BROWSE_CHUNK = 100;

      function langsForFilter() {
        if (currentLang === 'all' || currentLang === 'english') return Targum.LANGS.slice();
        return [currentLang];
      }

      // True when at least one of the requested language files loaded.
      function ensureData(langs) {
        return Promise.all(langs.map(function (lang) {
          return Targum.loadDict(lang).then(function () { return true; }, function () { return false; });
        })).then(function (flags) {
          return flags.some(function (flag) { return flag; });
        });
      }

      function showDataAlert() {
        resultsEl.innerHTML = '<div class="alert theme-warning" role="alert">Dictionary data is not available yet. Please try again later.</div>';
      }

      // Compact result row; clicking it expands the full entry card
      // (Bootstrap collapse) below the row.
      function summaryRow(entry, index) {
        var firstSense = String(entry.g || '').split(' | ')[0] || '';
        var langName = Targum.LANG_NAMES[entry.l] || entry.l || '';
        var langAttr = entry.l === 'yiddish' ? 'yi' : 'he';
        return '<div class="mb-3">' +
          '<button type="button" class="btn-outline theme-secondary w-100 d-flex flex-wrap align-items-center gap-3 text-start" data-bs-toggle="collapse" data-bs-target="#entry-detail-' + index + '" aria-expanded="false" aria-controls="entry-detail-' + index + '">' +
            '<span lang="' + langAttr + '" dir="rtl" class="targum-headword fs-lg">' + Targum.escapeHtml(entry.h || entry.p || '') + '</span>' +
            '<span class="badge theme-primary rounded-pill">' + Targum.escapeHtml(langName) + '</span>' +
            (entry.pos ? '<span class="fg-secondary small">' + Targum.escapeHtml(entry.pos) + '</span>' : '') +
            '<span class="fg-secondary small text-truncate">' + Targum.escapeHtml(firstSense) + '</span>' +
          '</button>' +
          '<div class="collapse mt-3" id="entry-detail-' + index + '">' +
            Targum.renderEntryCard(entry) +
          '</div>' +
        '</div>';
      }

      // The transliteration toggle appears only when displayed Yiddish
      // entries have a transliteration.
      function updateTranslitToggle() {
        var shown = currentResults.slice(0, shownCount);
        var anyTr = shown.some(function (entry) { return entry.l === 'yiddish' && entry.tr; });
        translitWrap.hidden = !anyTr;
        resultsEl.classList.toggle('hide-translit', !translitToggle.checked);
      }

      function renderResults() {
        var total = currentResults.length;
        var shown = currentResults.slice(0, shownCount);
        var html = '';
        if (total === 0) {
          html = '<p class="fg-secondary">No entries found.</p>';
        } else {
          html = '<p class="fg-secondary" role="status">Showing ' + shown.length + ' of ' + total + ' entries.</p>';
          html += shown.map(summaryRow).join('');
          if (shownCount < total) {
            html += '<button type="button" class="btn-outline theme-primary mt-3" id="show-more">Show more</button>';
          }
        }
        resultsEl.innerHTML = html;
        var moreBtn = document.getElementById('show-more');
        if (moreBtn) {
          moreBtn.addEventListener('click', function () {
            shownCount = Math.min(total, shownCount + PAGE_SIZE);
            renderResults();
          });
        }
        updateTranslitToggle();
        // A single result opens on its own (e.g. a cross-link from
        // the thesaurus that lands on one entry).
        if (total === 1) {
          // Bootstrap 6 has no window.bootstrap global; the collapse
          // is opened by marking it shown directly, which the
          // Collapse data API then toggles normally.
          var detail = document.getElementById('entry-detail-0');
          var toggle = document.querySelector('button[data-bs-target="#entry-detail-0"]');
          if (detail) detail.classList.add('show');
          if (toggle) toggle.setAttribute('aria-expanded', 'true');
        }
      }

      function runSearch() {
        var q = searchInput.value.trim();
        exitBrowseAll();
        currentLetter = null;
        markActiveLetter(null);
        if (!q) {
          currentResults = [];
          shownCount = 0;
          resultsEl.innerHTML = '<p class="fg-secondary">Type a word above to search, or choose a letter below to browse.</p>';
          updateTranslitToggle();
          return;
        }
        var seq = ++searchSeq;
        var langs = langsForFilter();
        var glossOnly = currentLang === 'english';
        ensureData(langs).then(function (ok) {
          if (seq !== searchSeq) return null;
          if (!ok) { showDataAlert(); return null; }
          return Targum.searchDict(q, langs, { glossOnly: glossOnly });
        }).then(function (results) {
          if (seq !== searchSeq || !results) return;
          currentResults = results;
          shownCount = Math.min(PAGE_SIZE, results.length);
          renderResults();
        });
      }

      // First Hebrew letter of a string, skipping leading punctuation
      // (some Jastrow headwords start with "(") and folding final
      // letters to their regular form (ך→כ, ם→מ, ן→נ, ף→פ, ץ→צ) so
      // entries group under the right Aleph-Beis letter.
      var SOFIT = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
      function firstHebrewLetter(str) {
        for (var i = 0; i < str.length; i++) {
          var ch = str.charAt(i);
          if (ch >= 'א' && ch <= 'ת') return SOFIT[ch] || ch;
        }
        return '';
      }

      function browseLetter(letter) {
        exitBrowseAll();
        currentLetter = letter;
        markActiveLetter(letter);
        searchInput.value = '';
        var langs = langsForFilter();
        var seq = ++searchSeq;
        resultsEl.innerHTML = '<p class="fg-secondary" role="status">Loading…</p>';
        ensureData(langs).then(function (ok) {
          if (seq !== searchSeq) return null;
          if (!ok) { showDataAlert(); return null; }
          return Promise.all(langs.map(function (lang) {
            return Targum.loadDict(lang).catch(function () { return []; });
          }));
        }).then(function (lists) {
          if (seq !== searchSeq || !lists) return;
          var matches = [];
          lists.forEach(function (list) {
            list.forEach(function (entry) {
              var plain = Targum.stripNikud(entry.p || entry.h || '');
              if (firstHebrewLetter(plain) === letter) matches.push(entry);
            });
          });
          matches.sort(function (a, b) {
            return String(a.p || '').localeCompare(String(b.p || ''), 'he');
          });
          currentResults = matches;
          shownCount = Math.min(PAGE_SIZE, matches.length);
          renderResults();
        });
      }

      function markActiveLetter(letter) {
        lettersEl.querySelectorAll('button').forEach(function (btn) {
          var isActive = letter !== null && btn.getAttribute('data-letter') === letter;
          btn.classList.toggle('btn-solid', isActive);
          btn.classList.toggle('btn-outline', !isActive);
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
      }

      function markBrowseAllActive(on) {
        browseAllBtn.classList.toggle('btn-solid', on);
        browseAllBtn.classList.toggle('btn-outline', !on);
        browseAllBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      }

      // Leave browse-all mode: stop the scroll observer and clear
      // the mode flag. The results area itself is replaced by
      // whatever the user does next (search, letter browse, idle).
      function exitBrowseAll() {
        if (browseObserver) { browseObserver.disconnect(); browseObserver = null; }
        browseAll = false;
        browseLastLetter = '';
        markBrowseAllActive(false);
      }

      function updateBrowseStatus() {
        var status = document.getElementById('browse-status');
        if (status) {
          status.textContent = 'Showing ' + shownCount + ' of ' + currentResults.length + ' entries.';
        }
      }

      // Append the next chunk of the browse-all list, with a letter
      // divider whenever the initial letter changes. Rows reuse
      // summaryRow with their global index, so each detail id stays
      // unique and tapping a row opens its entry as usual. Entries
      // with no Hebrew letter (a handful of punctuation-led and
      // Syriac-script headwords) group under "#".
      function appendBrowseChunk() {
        var listEl = document.getElementById('browse-list');
        if (!listEl || shownCount >= currentResults.length) return;
        var end = Math.min(currentResults.length, shownCount + BROWSE_CHUNK);
        var html = '';
        for (var i = shownCount; i < end; i++) {
          var entry = currentResults[i];
          var letter = firstHebrewLetter(Targum.stripNikud(entry.p || entry.h || '')) || '#';
          if (letter !== browseLastLetter) {
            browseLastLetter = letter;
            html += '<h3 class="h5 mt-7 mb-3 border-bottom pb-2"><span lang="he" dir="rtl">' +
              Targum.escapeHtml(letter) + '</span></h3>';
          }
          html += summaryRow(entry, i);
        }
        listEl.insertAdjacentHTML('beforeend', html);
        shownCount = end;
        updateBrowseStatus();
        updateTranslitToggle();
        if (shownCount >= currentResults.length) {
          if (browseObserver) { browseObserver.disconnect(); browseObserver = null; }
          var sentinel = document.getElementById('browse-sentinel');
          if (sentinel) sentinel.remove();
        }
      }

      // Browse-all mode: the full alphabetical list for the current
      // language filter, loaded 100 entries at a time as the user
      // scrolls (an IntersectionObserver on a sentinel at the end
      // of the list). Same sort order as letter browse.
      function enterBrowseAll() {
        browseAll = true;
        currentLetter = null;
        markActiveLetter(null);
        searchInput.value = '';
        markBrowseAllActive(true);
        if (browseObserver) { browseObserver.disconnect(); browseObserver = null; }
        var langs = langsForFilter();
        var seq = ++searchSeq;
        resultsEl.innerHTML = '<p class="fg-secondary" role="status">Loading…</p>';
        ensureData(langs).then(function (ok) {
          if (seq !== searchSeq) return null;
          if (!ok) { exitBrowseAll(); showDataAlert(); return null; }
          return Promise.all(langs.map(function (lang) {
            return Targum.loadDict(lang).catch(function () { return []; });
          }));
        }).then(function (lists) {
          if (seq !== searchSeq || !lists) return;
          var all = [];
          lists.forEach(function (list) { all = all.concat(list); });
          all.sort(function (a, b) {
            return String(a.p || '').localeCompare(String(b.p || ''), 'he');
          });
          currentResults = all;
          shownCount = 0;
          browseLastLetter = '';
          resultsEl.innerHTML =
            '<p class="fg-secondary" role="status" id="browse-status"></p>' +
            '<div id="browse-list"></div>' +
            '<div id="browse-sentinel" aria-hidden="true"></div>';
          updateBrowseStatus();
          browseObserver = new IntersectionObserver(function (entries) {
            if (entries.some(function (e) { return e.isIntersecting; })) appendBrowseChunk();
          }, { rootMargin: '600px 0px' });
          browseObserver.observe(document.getElementById('browse-sentinel'));
          appendBrowseChunk();
          resultsEl.scrollIntoView();
        });
      }

      Targum.HEBREW_LETTERS.forEach(function (letter) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-outline theme-primary btn-sm';
        btn.setAttribute('data-letter', letter);
        btn.setAttribute('aria-pressed', 'false');
        btn.setAttribute('aria-label', 'Browse entries starting with ' + letter);
        btn.textContent = letter;
        btn.addEventListener('click', function () { browseLetter(letter); });
        lettersEl.appendChild(btn);
      });

      browseAllBtn.addEventListener('click', function () {
        if (browseAll) {
          // Toggle off: back to the idle hint.
          exitBrowseAll();
          currentResults = [];
          shownCount = 0;
          resultsEl.innerHTML = '<p class="fg-secondary">Type a word above to search, or choose a letter below to browse.</p>';
          updateTranslitToggle();
        } else {
          enterBrowseAll();
        }
      });

      filterEl.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          filterEl.querySelectorAll('button').forEach(function (other) {
            other.classList.remove('active');
            other.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
          currentLang = btn.getAttribute('data-lang');
          updateUrl();
          if (browseAll) enterBrowseAll();
          else if (currentLetter) browseLetter(currentLetter);
          else if (searchInput.value.trim()) runSearch();
        });
      });

      function updateUrl() {
        var params = new URLSearchParams();
        var q = searchInput.value.trim();
        if (q) params.set('q', q);
        if (currentLang !== 'all') params.set('lang', currentLang);
        var query = params.toString();
        window.history.replaceState(null, '', window.location.pathname + (query ? '?' + query : ''));
      }

      searchForm.addEventListener('submit', function (event) {
        event.preventDefault();
        updateUrl();
        runSearch();
      });

      searchInput.addEventListener('input', function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () { updateUrl(); runSearch(); }, 250);
      });

      translitToggle.addEventListener('change', updateTranslitToggle);

      // Pre-fill from ?q= and ?lang= (cross-links from other pages).
      (function init() {
        var params = new URLSearchParams(window.location.search);
        var q = params.get('q') || '';
        var lang = params.get('lang') || 'all';
        var validLangs = ['all', 'modern', 'ancient', 'aramaic', 'yiddish', 'english'];
        if (validLangs.indexOf(lang) === -1) lang = 'all';
        currentLang = lang;
        filterEl.querySelectorAll('button').forEach(function (btn) {
          var isActive = btn.getAttribute('data-lang') === lang;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
        if (q) {
          searchInput.value = q;
          runSearch();
        } else {
          resultsEl.innerHTML = '<p class="fg-secondary">Type a word above to search, or choose a letter below to browse.</p>';
        }
      })();

      // Once the thesaurus map loads, re-render so "Synonyms" links
      // appear on entries that have a group (no-op while the
      // thesaurus data is absent).
      Targum.loadThesaurus().then(function (map) {
        // In browse-all mode the list is appended incrementally;
        // renderResults would replace it with a flat page, so skip
        // the re-render there (the thesaurus map starts loading at
        // page load and is far smaller than the dictionary files,
        // so it is loaded before the first chunk renders).
        if (Object.keys(map).length && currentResults.length && !browseAll) renderResults();
      });
    })();
  </script>
</body>
</html>
