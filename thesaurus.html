  <main class="container py-4">
    <h1>Thesaurus</h1>
    <p class="lead">Synonyms from <span lang="he" dir="rtl">ביאור שמות הנרדפים</span> (Biur Shemos HaNirdafim) by R&rsquo; Shlomo Aharon Wertheimer, Jerusalem 1924 — each synonym with a note on when that word is used. The notes are in Hebrew, condensed from the book itself.</p>

    <div class="d-flex flex-wrap gap-1 mb-3" id="thes-letters" dir="rtl" role="group" aria-label="Aleph-Beis index"></div>

    <div class="accordion" id="thesaurus-list"></div>
    <p class="text-body-secondary mt-3" id="thes-count" role="status"></p>
  </main>
  <div id="footer-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      'use strict';

      var listEl = document.getElementById('thesaurus-list');
      var lettersEl = document.getElementById('thes-letters');
      var countEl = document.getElementById('thes-count');
      var groups = [];
      var activeLetter = null;

      function dictLink(word) {
        return 'index.html?q=' + encodeURIComponent(word);
      }

      // Alphabetical headword list (Bootstrap accordion); clicking a
      // headword opens its synonym cards, each with a "Used when" note
      // and a link to its dictionary entry.
      function renderGroups() {
        var visible = activeLetter
          ? groups.filter(function (group) {
              return Targum.stripNikud(group.p || '').charAt(0) === activeLetter;
            })
          : groups;
        if (!visible.length) {
          listEl.innerHTML = '<p class="text-body-secondary">No synonym groups start with this letter.</p>';
        } else {
          listEl.innerHTML = visible.map(function (group, i) {
            var synCards = group.syn.map(function (syn) {
              // Synonyms flagged unclear have no recoverable explanation
              // in the scan — show the word without one, never invent.
              var whenHtml = syn.unclear ? '' :
                '<p class="card-text mb-2"><strong>Used when:</strong> ' +
                '<span lang="he" dir="rtl">' + Targum.escapeHtml(syn.when) + '</span></p>';
              return '<div class="card mb-2"><div class="card-body">' +
                '<h3 class="card-title targum-headword fs-4"><span lang="he" dir="rtl">' +
                Targum.escapeHtml(syn.w) + '</span></h3>' +
                whenHtml +
                '<a class="card-link" href="' + dictLink(Targum.stripNikud(syn.w)) +
                '">Look up in the Dictionary</a>' +
                '</div></div>';
            }).join('');
            return '<div class="accordion-item">' +
              '<h2 class="accordion-header" id="thes-heading-' + i + '">' +
                '<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#thes-collapse-' + i + '" aria-expanded="false" aria-controls="thes-collapse-' + i + '">' +
                  '<span lang="he" dir="rtl" class="targum-headword fs-5">' +
                  Targum.escapeHtml(group.h) + '</span>' +
                  '<span class="text-body-secondary small ms-2">' + group.syn.length + ' synonyms</span>' +
                '</button>' +
              '</h2>' +
              '<div id="thes-collapse-' + i + '" class="accordion-collapse collapse" aria-labelledby="thes-heading-' + i + '" data-bs-parent="#thesaurus-list">' +
                '<div class="accordion-body">' + synCards +
                  '<p class="mb-0"><a href="' + dictLink(Targum.stripNikud(group.p)) +
                  '">Look up <span lang="he" dir="rtl">' + Targum.escapeHtml(group.h) +
                  '</span> in the Dictionary</a></p>' +
                '</div>' +
              '</div>' +
            '</div>';
          }).join('');
        }
        countEl.textContent = visible.length + (visible.length === 1 ? ' group' : ' groups') +
          (activeLetter ? ' starting with ' + activeLetter + '.' : ' in total.');
      }

      function markActiveLetter() {
        lettersEl.querySelectorAll('button').forEach(function (btn) {
          var letter = btn.getAttribute('data-letter');
          var isActive = (letter === '' && activeLetter === null) || letter === activeLetter;
          btn.classList.toggle('btn-primary', isActive);
          btn.classList.toggle('btn-outline-primary', !isActive);
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
      }

      function buildLetters() {
        var allBtn = document.createElement('button');
        allBtn.type = 'button';
        allBtn.className = 'btn btn-primary btn-sm';
        allBtn.setAttribute('data-letter', '');
        allBtn.setAttribute('aria-pressed', 'true');
        allBtn.textContent = 'All';
        allBtn.addEventListener('click', function () {
          activeLetter = null;
          markActiveLetter();
          renderGroups();
        });
        lettersEl.appendChild(allBtn);
        Targum.HEBREW_LETTERS.forEach(function (letter) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn btn-outline-primary btn-sm';
          btn.setAttribute('data-letter', letter);
          btn.setAttribute('aria-pressed', 'false');
          btn.setAttribute('aria-label', 'Show groups starting with ' + letter);
          btn.textContent = letter;
          btn.addEventListener('click', function () {
            activeLetter = letter;
            markActiveLetter();
            renderGroups();
          });
          lettersEl.appendChild(btn);
        });
      }

      fetch('data/thesaurus.json')
        .then(function (response) {
          if (!response.ok) throw new Error('Thesaurus data could not be loaded.');
          return response.json();
        })
        .then(function (data) {
          groups = Array.isArray(data) ? data : [];
          groups.sort(function (a, b) {
            return String(a.p || '').localeCompare(String(b.p || ''), 'he');
          });
          buildLetters();
          renderGroups();
          openGroupFromUrl();
        })
        .catch(function () {
          listEl.innerHTML = '<div class="alert alert-warning" role="alert">Thesaurus data is not available yet. Please try again later.</div>';
        });

      // Deep link from the dictionary: ?group=<plain headword> opens
      // that group and scrolls to it.
      function openGroupFromUrl() {
        var params = new URLSearchParams(window.location.search);
        var target = params.get('group');
        if (!target) return;
        var idx = -1;
        for (var i = 0; i < groups.length; i++) {
          if (Targum.stripNikud(groups[i].p || '') === Targum.stripNikud(target)) {
            idx = i;
            break; // first group wins (מטה and עזר each have two groups)
          }
        }
        if (idx === -1) return;
        activeLetter = null;
        markActiveLetter();
        renderGroups();
        var el = document.getElementById('thes-collapse-' + idx);
        if (el && typeof bootstrap !== 'undefined' && bootstrap.Collapse) {
          new bootstrap.Collapse(el, { toggle: true });
          el.scrollIntoView({ block: 'start' });
        }
      }
    })();
  </script>
</body>
</html>
