</head>

  <main class="container py-4">
    <h1>Tools</h1>
    <p class="lead">Gematria calculator: enter one or two Hebrew phrases and compare their values.</p>

    <div class="row mb-3">
      <div class="col-md-6 mb-3 mb-md-0">
        <label for="phrase-1" class="form-label">First phrase</label>
        <input type="text" class="form-control targum-headword fs-5" id="phrase-1" lang="he" dir="rtl" placeholder="הקלד ביטוי בעברית" aria-label="First Hebrew phrase" autocomplete="off">
      </div>
      <div class="col-md-6">
        <label for="phrase-2" class="form-label">Second phrase (optional, to compare)</label>
        <input type="text" class="form-control targum-headword fs-5" id="phrase-2" lang="he" dir="rtl" placeholder="הקלד ביטוי שני להשוואה" aria-label="Second Hebrew phrase, optional" autocomplete="off">
      </div>
    </div>

    <fieldset class="mb-3">
      <legend class="fs-6">Method</legend>
      <div class="d-flex flex-wrap gap-3">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gematria-method" id="method-hechrachi" value="hechrachi" checked>
          <label class="form-check-label" for="method-hechrachi">Mispar Hechrachi (standard values)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gematria-method" id="method-siduri" value="siduri">
          <label class="form-check-label" for="method-siduri">Mispar Siduri (ordinal, 1–22)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gematria-method" id="method-katan" value="katan">
          <label class="form-check-label" for="method-katan">Mispar Katan (each letter reduced to one digit)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gematria-method" id="method-atbash" value="atbash">
          <label class="form-check-label" for="method-atbash">Atbash (aleph ↔ tav)</label>
        </div>
      </div>
    </fieldset>

    <fieldset class="mb-4">
      <legend class="fs-6">Im hakolel</legend>
      <div class="d-flex flex-wrap gap-3">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gematria-hakolel" id="hakolel-none" value="none" checked>
          <label class="form-check-label" for="hakolel-none">None</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gematria-hakolel" id="hakolel-word" value="word">
          <label class="form-check-label" for="hakolel-word">Add 1 per word</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gematria-hakolel" id="hakolel-letter" value="letter">
          <label class="form-check-label" for="hakolel-letter">Add 1 per letter</label>
        </div>
      </div>
    </fieldset>

    <div id="gematria-results" aria-live="polite"></div>
  </main>
  <div id="footer-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
