</head>

  <main class="container py-7">
    <h1>Tools</h1>
    <p class="fs-lg fw-light">Gematria calculator: enter one or two Hebrew phrases and compare their values.</p>

    <div class="row mb-5">
      <div class="md:col-6 mb-5 md:mb-0">
        <label for="phrase-1" class="form-label">First phrase</label>
        <input type="text" class="form-control targum-headword fs-lg" id="phrase-1" lang="he" dir="rtl" placeholder="הקלד ביטוי בעברית" aria-label="First Hebrew phrase" autocomplete="off">
      </div>
      <div class="md:col-6">
        <label for="phrase-2" class="form-label">Second phrase (optional, to compare)</label>
        <input type="text" class="form-control targum-headword fs-lg" id="phrase-2" lang="he" dir="rtl" placeholder="הקלד ביטוי שני להשוואה" aria-label="Second Hebrew phrase, optional" autocomplete="off">
      </div>
    </div>

    <fieldset class="mb-5">
      <legend class="fs-md">Method</legend>
      <div class="d-flex flex-wrap gap-5">
        <div class="form-field">
          <input type="radio" id="method-hechrachi" class="radio" name="gematria-method" value="hechrachi" checked>
          <label for="method-hechrachi">Mispar Hechrachi (standard values)</label>
        </div>
        <div class="form-field">
          <input type="radio" id="method-siduri" class="radio" name="gematria-method" value="siduri">
          <label for="method-siduri">Mispar Siduri (ordinal, 1–22)</label>
        </div>
        <div class="form-field">
          <input type="radio" id="method-katan" class="radio" name="gematria-method" value="katan">
          <label for="method-katan">Mispar Katan (each letter reduced to one digit)</label>
        </div>
        <div class="form-field">
          <input type="radio" id="method-atbash" class="radio" name="gematria-method" value="atbash">
          <label for="method-atbash">Atbash (aleph ↔ tav)</label>
        </div>
      </div>
    </fieldset>

    <fieldset class="mb-7">
      <legend class="fs-md">Im hakolel</legend>
      <div class="d-flex flex-wrap gap-5">
        <div class="form-field">
          <input type="radio" id="hakolel-none" class="radio" name="gematria-hakolel" value="none" checked>
          <label for="hakolel-none">None</label>
        </div>
        <div class="form-field">
          <input type="radio" id="hakolel-word" class="radio" name="gematria-hakolel" value="word">
          <label for="hakolel-word">Add 1 per word</label>
        </div>
        <div class="form-field">
          <input type="radio" id="hakolel-letter" class="radio" name="gematria-hakolel" value="letter">
          <label for="hakolel-letter">Add 1 per letter</label>
        </div>
      </div>
    </fieldset>

    <div id="gematria-results" aria-live="polite"></div>
  </main>
  <div id="footer-root"></div>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
